name: Import federal procurement data

# Refreshes the procurement_awards table from the Bureau of Public
# Procurement's open contracting data, which is republished monthly.
# Requires repository secrets DATABASE_URL and, for Supabase, DATABASE_SSL
# ("true") and optionally DATABASE_SSL_CA_CERT.
on:
  schedule:
    - cron: "17 3 23 * *" # 03:17 UTC on the 23rd, after the monthly refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-procurement
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm run records:import-procurement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          DATABASE_SSL_CA_CERT: ${{ secrets.DATABASE_SSL_CA_CERT }}
