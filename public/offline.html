<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b5bc7">
<title>You're offline · Journol</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #22233b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .mark { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: #5b5bc7; color: #fff; font-size: 38px; font-weight: 800; letter-spacing: -3px; padding: 0 6px 6px 0; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 24px 0 8px; }
  p { color: #626279; font-size: 15px; line-height: 1.6; max-width: 340px; margin: 0 auto 24px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #5b5bc7; color: #fff; font: 700 15px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">j.</span>
    <h1>You're offline</h1>
    <p>Journol needs the internet to read stories and search other outlets. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
